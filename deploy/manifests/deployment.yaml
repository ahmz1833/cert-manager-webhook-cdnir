apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert-manager-webhook-cdnir
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager-webhook-cdnir
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-manager-webhook-cdnir
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cert-manager-webhook-cdnir
    spec:
      serviceAccountName: cert-manager-webhook-cdnir
      containers:
        - name: cert-manager-webhook-cdnir
          image: "ghcr.io/ahmz1833/cert-manager-webhook-cdnir:latest"
          imagePullPolicy: IfNotPresent
          args:
            - --tls-cert-file=/tls/tls.crt
            - --tls-private-key-file=/tls/tls.key
            - --secure-port=8443
          env:
            - name: GROUP_NAME
              value: "acme.cdn.ir"
            # Optional fallback environment variable
            # - name: CDNIR_API_TOKEN
            #   valueFrom:
            #     secretKeyRef:
            #       name: cdnir-api-token
            #       key: token
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: certs
              mountPath: /tls
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: certs
          secret:
            secretName: cert-manager-webhook-cdnir-webhook-tls
