apiVersion: v1
kind: Service
metadata:
  name: {{ include "cert-manager-webhook-cdnir.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "cert-manager-webhook-cdnir.name" . }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: https
      protocol: TCP
      name: https
  selector:
    app.kubernetes.io/name: {{ include "cert-manager-webhook-cdnir.name" . }}
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1alpha1.{{ .Values.groupName }}
  labels:
    app.kubernetes.io/name: {{ include "cert-manager-webhook-cdnir.name" . }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "cert-manager-webhook-cdnir.fullname" . }}-webhook-tls
spec:
  group: {{ .Values.groupName }}
  groupPriorityMinimum: 1000
  versionPriority: 15
  service:
    name: {{ include "cert-manager-webhook-cdnir.fullname" . }}
    namespace: {{ .Release.Namespace }}
  version: v1alpha1
