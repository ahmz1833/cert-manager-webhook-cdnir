apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cert-manager-webhook-cdnir.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "cert-manager-webhook-cdnir.name" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cert-manager-webhook-cdnir.fullname" . }}:secret-reader
  namespace: {{ .Values.certManager.namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cert-manager-webhook-cdnir.fullname" . }}:secret-reader
  namespace: {{ .Values.certManager.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cert-manager-webhook-cdnir.fullname" . }}:secret-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "cert-manager-webhook-cdnir.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cert-manager-webhook-cdnir.fullname" . }}:flowcontrol-solver
rules:
  - apiGroups:
      - "flowcontrol.apiserver.k8s.io"
    resources:
      - "prioritylevelconfigurations"
      - "flowschemas"
    verbs:
      - "list"
      - "watch"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cert-manager-webhook-cdnir.fullname" . }}:flowcontrol-solver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cert-manager-webhook-cdnir.fullname" . }}:flowcontrol-solver
subjects:
  - kind: ServiceAccount
    name: {{ include "cert-manager-webhook-cdnir.fullname" . }}
    namespace: {{ .Release.Namespace }}
